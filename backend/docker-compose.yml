services:
  mongodb:
    image: mongo:7
    container_name: quarry-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${DATABASE_NAME}
    ports:
      - "27017:27017"          # exposed so `make dev` (local uvicorn) can connect
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quarry-backend
    restart: unless-stopped
    # Dev-only reload. The Dockerfile's default CMD is deliberately reload-free so
    # the CI-built image is production-safe; local dev opts back in here, where the
    # bind-mount below actually makes reload useful.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    env_file:
      - .env
    environment:
      # Override MONGODB_URL so the container uses the Docker-internal hostname
      MONGODB_URL: mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongodb:27017/${DATABASE_NAME}?authSource=admin
    ports:
      - "8000:8000"
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - .:/app

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: quarry-frontend
    restart: unless-stopped
    ports:
      - "3000:80"          # open the app at http://localhost:3000
    depends_on:
      - backend

volumes:
  mongo_data:
