[project]
name = "backend"
version = "0.1.0"
description = "Quarry AI-powered B2B Lead Generation Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=4.2.1",
    "fastapi>=0.111.0",
    "groq>=1.1.2",
    "motor>=3.6.0",
    "pydantic[email]>=2.9.2",
    "python-dotenv>=1.0.1",
    "python-jose[cryptography]>=3.3.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "requests>=2.32.0",
    "litellm>=1.83.14",
    "playwright>=1.49.1",
    "openpyxl>=3.1.2",
    "reportlab>=4.0.0",
    "pypdf>=4.0.0",
    "python-multipart>=0.0.9",
    "dnspython>=2.6.0",
    "aiosmtplib>=3.0.0",
]

# Dev/CI tooling is declared in requirements-dev.txt rather than a
# [dependency-groups] table on purpose: adding a group here would invalidate the
# committed uv.lock, and `uv sync --frozen` would start failing until someone
# regenerates it. Keeping dev deps in a pip-installable file leaves uv.lock valid
# and mirrors the existing requirements.txt/pyproject split.

[tool.ruff]
target-version = "py313"
line-length = 120
exclude = [
    ".venv",
    "__pycache__",
    "exports",
]

[tool.ruff.lint]
# Conservative starting set: real bugs, not style churn. This codebase has no
# prior lint gate, so enabling the full ruleset would bury CI in pre-existing
# findings. Widen this over time.
select = [
    "E4",   # import formatting
    "E7",   # statement issues
    "E9",   # syntax/runtime errors
    "F",    # pyflakes: undefined names, unused imports
    "B",    # bugbear: likely bugs
]
ignore = [
    "B008",  # function call in default arg — required by FastAPI's Depends()
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

