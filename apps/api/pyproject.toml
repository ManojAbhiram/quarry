[project]
name = "quarry-api"
version = "0.1.0"
description = "Quarry AI-powered B2B Lead Generation Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=4.2.1",
    "fastapi>=0.111.0",
    "groq>=1.1.2",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20.0",
    "pydantic[email]>=2.9.2",
    "python-dotenv>=1.0.1",
    "python-jose[cryptography]>=3.3.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "requests>=2.32.0",
    "litellm>=1.83.14",
    "playwright>=1.49.1",
    "openpyxl>=3.1.2",
    "reportlab>=4.0.0",
    "pypdf>=4.0.0",
    "python-multipart>=0.0.9",
    "dnspython>=2.6.0",
    "aiosmtplib>=3.0.0",
]

# Dev tooling lives in a dependency group so a plain `uv sync` installs it (pytest, ruff). CI that prefers pip
# can still use requirements-dev.txt; keep the two in step.
[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.16",
]

[tool.ruff]
target-version = "py313"
line-length = 120
exclude = [
    ".venv",
    "__pycache__",
    "exports",
]

[tool.ruff.lint]
# Conservative starting set: real bugs, not style churn. This codebase has no
# prior lint gate, so enabling the full ruleset would bury CI in pre-existing
# findings. Widen this over time.
select = [
    "E4",   # import formatting
    "E7",   # statement issues
    "E9",   # syntax/runtime errors
    "F",    # pyflakes: undefined names, unused imports
    "B",    # bugbear: likely bugs
]
ignore = [
    "B008",  # function call in default arg — required by FastAPI's Depends()
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

